---

# This is a basic workflow to help you get started with Actions

name: Ansible Remediate Devel Pipeline Validation

# Controls when the action will run.
# Triggers the workflow on push or pull request
# events for the devel branch and the benchmark* release branches
on:  # yamllint disable-line rule:truthy
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - devel
      - benchmark*
    paths:
      - '**.yml'
      - '**.sh'
      - '**.j2'
      - '**.ps1'
      - '**.cfg'
  # Allow manual running of workflow
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# This section contains all the jobs below that are running in the workflow.
jobs:
  # This will create messages for the first time contributors and direct them to the Discord server
  welcome:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      # Pinned rather than tracking @main. The hyphenated repo-token and pr-message inputs were
      # renamed upstream, so the welcome comment had silently stopped posting. issue_message is
      # supplied because the v3.1.0 runtime calls getInput for it with required: true, even though
      # its own action.yml does not mark it required, and the job fails without it.
      - uses: actions/first-interaction@v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |-
            Thank you for opening your first issue and for taking the time to help improve Ansible-Lockdown!
            Please join in the conversation happening on the [Discord Server](https://www.lockdownenterprise.com/discord) as well.
          pr_message: |-
            Congrats on opening your first pull request and thank you for taking the time to help improve Ansible-Lockdown!
            Please join in the conversation happening on the [Discord Server](https://www.lockdownenterprise.com/discord) as well.

  build-azure-windows:
    # Use the AWS self-hosted runner
    # Only run for pull requests raised from a branch in this repository.
    # pull_request_target exposes repository secrets, so a fork PR must never
    # reach the steps below, which check out PR head and execute it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted

    # Least privilege for the job that holds the cloud credentials.
    permissions:
      id-token: write
      contents: read
      pull-requests: read

    env:
      # Imported as a variable by OpenTofu.
      ARM_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      WIN_USERNAME: ${{ secrets.WIN_USERNAME }}
      WIN_PASSWORD: ${{ secrets.WIN_PASSWORD }}
      OSVAR: ${{ vars.OSVAR }}
      TF_VAR_benchmark_type: ${{ vars.BENCHMARK_TYPE }}
      TF_VAR_repository: ${{ github.event.repository.name }}
      ANSIBLE_VERSION: ${{ vars.ANSIBLE_RUNNER_VERSION }}
      ENABLE_DEBUG: ${{ vars.ENABLE_DEBUG }}

    defaults:
      run:
        shell: bash
        working-directory: .github/workflows/github_windows_IaC

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it.
      - name: Clone ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: If a variable for IAC_BRANCH is set use that branch
        working-directory: .github/workflows
        run: |
          if [ -n "${{ vars.IAC_BRANCH }}" ]; then
              echo "IAC_BRANCH=${{ vars.IAC_BRANCH }}" >> $GITHUB_ENV
              echo "Pipeline using the following IAC branch ${{ vars.IAC_BRANCH }}"
          else
              echo IAC_BRANCH=main >> $GITHUB_ENV
          fi

      # Pull In OpenTofu Code For Windows Azure
      - name: Clone IaC Repository
        uses: actions/checkout@v7
        with:
          repository: ansible-lockdown/github_windows_IaC
          path: .github/workflows/github_windows_IaC
          ref: ${{ env.IAC_BRANCH }}

      # Sensitive Data Stored And Passed To OpenTofu
      # Default Working Dir Defined In Defaults Above.
      - name: Save Sensitive Info
        run: echo "{\"username\":\"${WIN_USERNAME}\",\"password\":\"${WIN_PASSWORD}\"}" >> sensitive_info.json

      # Show the Os Var and Benchmark Type And Load
      - name: DEBUG - Show IaC files
        if: env.ENABLE_DEBUG == 'true'
        run: |
          echo "OSVAR = $OSVAR"
          echo "benchmark_type = $TF_VAR_benchmark_type"
          pwd
          ls
        env:
          # Imported from github variables this is used to load the relevant OS.tfvars file
          OSVAR: ${{ vars.OSVAR }}
          TF_VAR_benchmark_type: ${{ vars.BENCHMARK_TYPE }}

      # Initialize The OpenTofu Working Directory
      - name: Tofu init
        id: init
        run: tofu init
        env:
          # Imported from GitHub variables this is used to load the relevant OS.tfvars file
          OSVAR: ${{ vars.OSVAR }}
          TF_VAR_benchmark_type: ${{ vars.BENCHMARK_TYPE }}

      # Validate The Syntax Of OpenTofu Files
      - name: Tofu validate
        id: validate
        run: tofu validate
        env:
          # Imported from GitHub variables this is used to load the relevant OS.tfvars file
          OSVAR: ${{ vars.OSVAR }}
          TF_VAR_benchmark_type: ${{ vars.BENCHMARK_TYPE }}

      # Execute The Actions And Build Azure Server
      - name: Tofo Apply
        id: apply
        env:
          # Imported from github variables this is used to load the relevant OS.tfvars file
          WIN_USERNAME: ${{ secrets.WIN_USERNAME }}
          WIN_PASSWORD: ${{ secrets.WIN_PASSWORD }}
          OSVAR: ${{ vars.OSVAR }}
          TF_VAR_benchmark_type: ${{ vars.BENCHMARK_TYPE }}
        run: tofu apply -var-file "${OSVAR}.tfvars" --auto-approve -input=false

      # Debug Section
      - name: DEBUG - Show Ansible Hostfile
        if: env.ENABLE_DEBUG == 'true'
        run: cat hosts.yml

      # Run the Ansible Playbook
      - name: Run_Ansible_Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_DEPRECATION_WARNINGS: "false"
        run: |
          /opt/ansible_${{ env.ANSIBLE_VERSION }}_venv/bin/ansible-playbook -i hosts.yml ../../../site.yml

      # Destroy The Azure Test System
      - name: Tofu Destroy
        if: always() && env.ENABLE_DEBUG != 'true'
        env:
          # Imported from GitHub variables this is used to load the relevant OS.tfvars file
          OSVAR: ${{ vars.OSVAR }}
          TF_VAR_benchmark_type: ${{ vars.BENCHMARK_TYPE }}
        run: tofu destroy -var-file "${OSVAR}.tfvars" --auto-approve
