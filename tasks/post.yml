---

- name: "POST | Flush Handlers"
  tags: always
  ansible.builtin.meta: flush_handlers

- name: "POST | Reboot System Options"
  tags: always
  block:
    - name: "POST | Rebooting System................. skip_reboot has been set to: False"
      when:
        - change_requires_reboot | bool
        - not skip_reboot | bool
      ansible.windows.win_reboot:
        reboot_timeout: 3600

    - name: "POST | Warning a Reboot is Required, skip_reboot has been set"
      when:
        - change_requires_reboot | bool
        - skip_reboot | bool
      ansible.builtin.debug:
        msg:
          - "Warning!! Changes have been made that requires a reboot to be implemented manually."
          - "skip_reboot was set to: True (This can affect compliance check results)"
      changed_when: true

    - name: "POST | Warning a Reboot is Required, skip_reboot has been set | Warning Count"
      when:
        - change_requires_reboot | bool
        - skip_reboot | bool
      vars:
        warn_control_id: 'Reboot_Required'
      ansible.builtin.import_tasks:
        file: warning_facts.yml
