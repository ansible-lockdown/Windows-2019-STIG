- name: "MEDIUM | WN19-SO-000100 | PATCH | Windows Server 2019 maximum age for machine account passwords must be configured to 30 days or less."
  when: wn19_so_000100 | bool
  tags:
    - WN19-SO-000100
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-205911r991589_rule
    - V-205911
    - NIST800-53R4_CM-6
  block:
    - name: "MEDIUM | WN19-SO-000100 | AUDIT | Windows Server 2019 maximum age for machine account passwords must be configured to 30 days or less. | Number Of Days Check."
      when: win19stig_machineaccountpassword_max_age > 30 or win19stig_machineaccountpassword_max_age == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not set the right number of days for win19stig_machineaccountpassword_max_age"
          - "Please read the notes for the variable and make the necessary changes to the variable to be in compliance."

    - name: "MEDIUM | WN19-SO-000100 | AUDIT | Windows Server 2019 maximum age for machine account passwords must be configured to 30 days or less. | Warn Count."
      when: win19stig_machineaccountpassword_max_age > 30 or win19stig_machineaccountpassword_max_age == 0
      vars:
        warn_control_id: 'MEDIUM | WN19-SO-000100'
      ansible.builtin.import_tasks: warning_facts.yml

    - name: "MEDIUM | WN19-SO-000100 | PATCH | Windows Server 2019 maximum age for machine account passwords must be configured to 30 days or less. | Apply Variable."
      when:
        - win19stig_machineaccountpassword_max_age <= 30
        - win19stig_machineaccountpassword_max_age != 0
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        state: present
        value: MaximumPasswordAge
        data: "{{ win19stig_machineaccountpassword_max_age }}"
        datatype: dword

