      when: "'guestchangethis' in win19stig_newguestname"
      ansible.builtin.debug:
        msg:
          - "Warning!! You have not changed the default name for win19stig_newguestname, please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN19-SO-000040 | AUDIT | Windows Server 2019 built-in guest account must be renamed. | Warn Count."
