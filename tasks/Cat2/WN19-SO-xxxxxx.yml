          - "Warning!! You have not chosen the correct setting for win19stig_consentprompt"
          - "Please read the notes for the variable and make the necessary changes to the variable to be in compliance."

    - name: "MEDIUM | WN19-SO-000400 | PATCH | Windows Server 2019 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Warn Count."
      when: win19stig_consentprompt < 1 or win19stig_consentprompt > 2
      vars:
        warn_control_id: 'MEDIUM | WN19-SO-000400'
      ansible.builtin.import_tasks: warning_facts.yml

    - name: "MEDIUM | WN19-SO-000400 | PATCH | Windows Server 2019 User Account Control must, at a minimum, prompt administrators for consent on the secure desktop. | Apply Variable."
      when: win19stig_consentprompt == 1 or win19stig_consentprompt == 2
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        state: present
        value: ConsentPromptBehaviorAdmin
        data: "{{ win19stig_consentprompt }}"
        datatype: dword

