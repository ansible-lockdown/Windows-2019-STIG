- name: "MEDIUM | WN19-00-000150 | PATCH | Permissions for system files and directories must conform to minimum requirements."
  when:
    - wn19_00_000150 | bool
    - wn19_so_000240 | bool
  tags:
    - WN19-00-000150
    - CAT2
    - CCI-002165
    - SRG-OS-000312-GPOS-00122
    - SV-205735r958702_rule
    - V-205735
    - NIST800-53R4_AC-3_4
  block:
    - name: "MEDIUM | WN19-00-000150 | AUDIT | Permissions for system files and directories must conform to minimum requirements. | Check file system permissions for key directories"
      ansible.windows.win_shell:
        cmd: |
          $paths = @("C:\", "C:\Program Files", "C:\Windows")
          foreach ($path in $paths) {
              $permissions = icacls $path
              Write-Output "Checking: $path"
              Write-Output $permissions
          }
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000150_filesystem_permissions

    - name: "MEDIUM | WN19-00-000150 | AUDIT | Permissions for system files and directories must conform to minimum requirements. | Set Fact fir Find mismatched permissions"
      ansible.builtin.set_fact:
        discovered_00_000150_mismatched_permissions: {}

    - name: "MEDIUM | WN19-00-000150 | AUDIT | Permissions for system files and directories must conform to minimum requirements. | Identify mismatches for each directory"
      when: discovered_00_000150_filesystem_permissions.stdout_lines is defined and win19stig_default_expected_permissions[item] is defined
      ansible.builtin.set_fact:
        discovered_00_000150_mismatched_permissions: "{{ discovered_00_000150_mismatched_permissions | combine({item: discovered_00_000150_filesystem_permissions.stdout_lines | difference(win19stig_default_expected_permissions[item])}) }}"
      loop:
        - "C"
        - "ProgramFiles"
        - "Windows"

    - name: "MEDIUM | WN19-00-000150 | AUDIT | Permissions for system files and directories must conform to minimum requirements. | Display Mismatched Permissions Warning"
      when: not win19stig_auto_remediate_permissions | bool and discovered_00_000150_mismatched_permissions | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! Mismatched permissions found but NOT remediated"
          - "STIG states you are required Maintain the default file system permissions and configure the Security"
          - "Option: Network access: Let everyone permissions apply to anonymous users is set Disabled in the registry. (WN11-SO-000160)."
          - "{{ discovered_00_000150_mismatched_permissions }}"

    - name: "MEDIUM | WN19-00-000150 | PATCH | Permissions for system files and directories must conform to minimum requirements. | Remediate file system permissions (only mismatched ones)."
      changed_when: "'Fixed permissions' in discovered_00_000150_remediation_result.stdout"
      when: win19stig_auto_remediate_permissions | bool and discovered_00_000150_mismatched_permissions | length > 0
      ansible.windows.win_shell:
        cmd: |
          $paths = @("C:\", "C:\Program Files", "C:\Windows")
          $fixedPermissions = @()

          foreach ($path in $paths) {
              $currentPermissions = icacls $path
              $expectedPermissions = @(
                  {% for path, perms in win19stig_default_expected_permissions.items() %}
                      {% for perm in perms %}
                          "{{ perm }}"
                      {% endfor %}
                  {% endfor %}
              )

              $missingPermissions = @()
              foreach ($perm in $expectedPermissions) {
                  if ($currentPermissions -notcontains $perm) {
                      $missingPermissions += $perm
                  }
              }

              if ($missingPermissions.Count -gt 0) {
                  foreach ($perm in $missingPermissions) {
                      icacls $path /grant $perm | Out-Null
                  }
                  $fixedPermissions += "Fixed permissions for $path: $missingPermissions"
              }
          }

          if ($fixedPermissions.Count -gt 0) {
              Write-Output $fixedPermissions
          } else {
              Write-Output "No permissions needed remediation."
          }
      register: discovered_00_000150_remediation_result

    - name: "MEDIUM | WN19-00-000150 | AUDIT | Permissions for system files and directories must conform to minimum requirements. | Display Remediation Results"
      when: win19stig_auto_remediate_permissions | bool and discovered_00_000150_mismatched_permissions | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! The following permissions have been remediated by the Ansible."
          - "{{ discovered_00_000150_mismatched_permissions }}"

    - name: "MEDIUM | WN19-00-000150 | AUDIT | Permissions for system files and directories must conform to minimum requirements. | Warn Count."
      when: (not win19stig_auto_remediate_permissions | bool and discovered_00_000150_mismatched_permissions | length > 0) or (win19stig_auto_remediate_permissions | bool and discovered_00_000150_mismatched_permissions | length > 0)
      ansible.builtin.import_tasks: warning_facts.yml
      vars:
        warn_control_id: 'MEDIUM | WN19-00-000150'

