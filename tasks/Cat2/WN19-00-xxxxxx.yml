---

# enumerating on DC is different than standalone
- name: "MEDIUM | WN19-00-000020 | AUDIT | Windows Server 2019 passwords for the built-in Administrator account must be changed at least every 60 days."
  when: wn19_00_000020 | bool
  tags:
    - WN19-00-000020
    - CAT2
    - CCI-000199
    - CCI-004066
    - SRG-OS-000076-GPOS-00044
    - SV-205657r1153431_rule
    - V-205657
    - NIST800-53R4_IA-5
    - audit
  block:
    - name: "MEDIUM | WN19-00-000020 | AUDIT - DOMAIN CONTROLLER | Windows Server 2019 passwords for the built-in Administrator account must be changed at least every 60 days."
      when: "'controller' in ansible_facts['windows_domain_role']"
      ansible.windows.win_shell: "Get-ADUser -Filter * -Property PasswordLastSet | Where SID -like S-1-5-21-*-500 | Where-Object {$_.PasswordLastSet -lt ((Get-Date).AddDays(-{{ win19stig_pass_age_administrator }}))} | Select Name,PasswordLastSet"
      # win_shell: "Get-ADUser krbtgt -Property PasswordLastSet | Where-Object {$_.PasswordLastSet -lt ((Get-Date).AddDays(-{{ win19stig_krbtgt_pass_age }}))} | Select-Object -ExpandProperty PasswordLastSet"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000020_audit_dc

    - name: "MEDIUM | WN19-00-000020 | AUDIT - DOMAIN CONTROLLER | Windows Server 2019 passwords for the built-in Administrator account must be changed at least every 60 days."
      when:
        - not discovered_00_000020_audit_dc is skipped
        - discovered_00_000020_audit_dc.stdout != ""
        - win19stig_pass_age_administrator <= 60
      ansible.builtin.debug:
        msg:
          - "The following account appears to be the default admin account and the password does not meet the control specific age of {{ win19stig_pass_age_administrator }}"
          - "{{ discovered_00_000020_audit_dc.stdout.split('\n') }}"

    - name: "MEDIUM | WN19-00-000020 | AUDIT - DOMAIN MEMBERS OR STANDALONE | Windows Server 2019 passwords for the built-in Administrator account must be changed at least every 60 days."
      ansible.windows.win_shell: "Get-Localuser -Name * | Select * | Where SID -like S-1-5-21-*-500 | Where-Object {$_.PasswordLastSet -lt ((Get-Date).AddDays(-{{ win19stig_pass_age_administrator }}))} | Select Name,PasswordLastSet"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_00_000020_audit_dm_sa

    - name: "MEDIUM | WN19-00-000020 | AUDIT - DOMAIN MEMBERS OR STANDALONE | Windows Server 2019 passwords for the built-in Administrator account must be changed at least every 60 days."
      when:
        - discovered_00_000020_audit_dm_sa is defined
        - discovered_00_000020_audit_dm_sa.stdout != ""
        - win19stig_pass_age_administrator <= 60
      ansible.builtin.debug:
        msg:
          - "The following account appears to be the default admin account and the password does not meet the control specific age of {{ win19stig_pass_age_administrator }}"
          - "{{ discovered_00_000020_audit_dm_sa.stdout.split('\n') }}"

    - name: Warning Message
      when: win19stig_pass_age_administrator > 60
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of days set for win19stig_pass_age_administrator please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN19-00-000020 | AUDIT | Windows Server 2019 passwords for the built-in Administrator account must be changed at least every 60 days. | Warn Count."
      # When statement does not follow standard formatting.
      when:
        - not discovered_00_000020_audit_dc is skipped
        - discovered_00_000020_audit_dc.stdout != ""
        - win19stig_pass_age_administrator <= 60 or discovered_00_000020_audit_dm_sa is defined
        - discovered_00_000020_audit_dm_sa.stdout != ""
        - win19stig_pass_age_administrator <= 60 or win19stig_pass_age_administrator > 60
      vars:
        warn_control_id: 'MEDIUM | WN19-00-000020'
      ansible.builtin.import_tasks: warning_facts.yml

