## This seems highly prone to breakage. It's a DC account and has been replicated. May Cause, Kerberos tickets stoppage and break authentication protocols.
## https://www.kjctech.net/do-you-need-to-update-krbtgt-account-password/
- name: "MEDIUM | WN19-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days."
  when:
    - wn19_dc_000430 | bool
    - prelim_is_domain_controller | bool
    - win19stig_complexity_high | bool
  tags:
    - WN19-DC-000430
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-205877r991589_rule
    - V-205877
    - NIST800-53R4_CM-6
  block:
    - name: "MEDIUM | WN19-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days."
      when: win19stig_krbtgt_account_pass_age <= 180
      ansible.windows.win_shell: "Get-ADUser krbtgt -Property PasswordLastSet | Where-Object {$_.PasswordLastSet -lt ((Get-Date).AddDays(-{{ win19stig_krbtgt_account_pass_age }}))} | Select-Object -ExpandProperty PasswordLastSet"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_dc_000430_audit

    - name: "MEDIUM | WN19-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days. | Warning Message Variable."
      when: win19stig_krbtgt_account_pass_age > 180
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of days set for win19stig_krbtgt_account_pass_age please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "MEDIUM | WN19-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days. | Warning Message Account."
      when:
        - win19stig_krbtgt_account_pass_age <= 180
        - discovered_dc_000430_audit.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! The password for the krbtgt account on a domain must be reset at least every 180 days."
          - "Your password is currently out of STIG compliance and has not been reset in the last 180 days."
          - "{{ discovered_dc_000430_audit.stdout_lines | trim }}"

    - name: "MEDIUM | WN19-DC-000430 | AUDIT | The password for the krbtgt account on a domain must be reset at least every 180 days. | import reusable task."
      when:
        - win19stig_krbtgt_account_pass_age <= 180
        - discovered_dc_000430_audit.stdout | length > 0 or win19stig_krbtgt_account_pass_age > 180
      vars:
        warn_control_id: 'MEDIUM | WN19-DC-000430'
      ansible.builtin.import_tasks: warning_facts.yml
