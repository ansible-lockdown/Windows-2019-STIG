---

# populate a dictionary/list from the customer
- name: "HIGH | WN19-MS-000010 | AUDIT | Windows Server 2019 must only allow Administrators responsible for the member server or standalone or nondomain-joined system to have Administrator rights on the system"
  when:
    - wn19_ms_000010 | bool
    - not prelim_is_domain_controller | bool
  tags:
    - WN19-MS-000010
    - CAT1
    - CCI-002235
    - SRG-OS-000324-GPOS-00125
    - SV-205746r958726_rule
    - V-205746
    - NIST800-53R4_AC-6
    - audit
  block:
    - name: "HIGH | WN19-MS-000010 | AUDIT | Windows Server 2019 must only allow Administrators responsible for the member server or standalone or nondomain-joined system to have Administrator rights on the system"
      ansible.windows.win_shell: Get-LocalGroupMember -Name 'Administrators'
      changed_when: false
      check_mode: false
      register: discovered_ms_000010_audit

    - name: "HIGH | WN19-MS-000010 | AUDIT | Windows Server 2019 must only allow Administrators responsible for the member server or standalone or nondomain-joined system to have Administrator rights on the system"
      ansible.builtin.debug:
        msg:
          - The following users or groups have Administrator rights on this system
          - "{{ discovered_ms_000010_audit.stdout.split('\n') }}"
      changed_when: false

    - name: "HIGH | WN19-MS-000010 | AUDIT | Windows Server 2019 must only allow Administrators responsible for the member server or standalone or nondomain-joined system to have Administrator rights on the system | Warn Count."
      vars:
        warn_control_id: 'HIGH | WN19-MS-000010'
      ansible.builtin.import_tasks: warning_facts.yml

- name: "HIGH | WN19-MS-000140 | PATCH | Windows Server 2019 must be running Credential Guard on domain-joined member servers."
  when:
    - wn19_ms_000140 | bool
    - prelim_is_domain_member | bool
  tags:
    - WN19-MS-000140
    - CAT1
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-205907r991589_rule
    - V-205907
    - NIST800-53R4_CM-6
    - NeedToTestMemberServer
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
    value: "{{ item }}"
    data: 1
    datatype: dword
  # RequirePlatformSecurityFeatures is deliberately absent. It belongs to WN19-CC-000110, which
  # sets it from win19stig_dma_protection (default 3). Writing 1 here as well made Cat1 set 3->1
  # and Cat2 set 1->3 on every run, so both tasks always reported changed and the tunable was
  # silently overridden. LsaCfgFlags is the only value this control's check text requires.
  with_items:
    - EnableVirtualizationBasedSecurity
    - HypervisorEnforcedCodeIntegrity
    - HVCIMATRequired
    - LsaCfgFlags
