---

# vars file for Windows-2019-STIG

min_ansible_version: 2.16.1

# Used to control warning summary
warn_control_list: ""
warn_count: 0

# Banner shown at the start of a run, read from templates/banner.txt.
lockdown_banner: "{{ lookup('file', './templates/banner.txt') }}"

# These are default values that will be changed when the prelim
# runs and finds the correct setting.
prelim_is_standalone: false
prelim_is_domain_controller: false
prelim_is_domain_member: false

# Starts false. The Change_requires_reboot handler sets it to true when notified, and
# tasks/post.yml then either reboots or warns, depending on skip_reboot. Do not set it by hand.
change_requires_reboot: false

# win19stig_default_expected_permissions lists the file system permissions that are adequate when the Security
# Option "Network access: Let Everyone permissions apply to anonymous users" is set to "Disabled".
# Consumed by WN19-SO-000240.
win19stig_default_expected_permissions:
  C:
    - "S-1-15-3-65536-1888954469-739942743-1668119174-2468466756-4239452838-1296943325-355587736-700089176 (S,RD,X,RA)"
    - "BUILTIN\\Administrators:(OI)(CI)(F)"
    - "NT AUTHORITY\\SYSTEM:(OI)(CI)(F)"
    - "BUILTIN\\Users:(OI)(CI)(RX)"
    - "NT AUTHORITY\\Authenticated Users:(OI)(CI)(IO)(M)"
    - "NT AUTHORITY\\Authenticated Users:(AD)"
    - "Mandatory Label\\High Mandatory Level:(OI)(NP)(IO)(NW)"
  ProgramFiles:
    - "NT SERVICE\\TrustedInstaller:(F)"
    - "NT AUTHORITY\\SYSTEM:(M)"
    - "NT AUTHORITY\\SYSTEM:(OI)(CI)(IO)(F)"
    - "BUILTIN\\Administrators:(M)"
    - "BUILTIN\\Administrators:(OI)(CI)(IO)(F)"
    - "BUILTIN\\Users:(RX)"
    - "BUILTIN\\Users:(OI)(CI)(IO)(GR,GE)"
    - "CREATOR OWNER:(OI)(CI)(IO)(F)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:(RX)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:(RX)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)"
  Windows:
    - "NT SERVICE\\TrustedInstaller:(F)"
    - "NT SERVICE\\TrustedInstaller:(CI)(IO)(F)"
    - "NT AUTHORITY\\SYSTEM:(M)"
    - "NT AUTHORITY\\SYSTEM:(OI)(CI)(IO)(F)"
    - "BUILTIN\\Administrators:(M)"
    - "BUILTIN\\Administrators:(OI)(CI)(IO)(F)"
    - "BUILTIN\\Users:(RX)"
    - "BUILTIN\\Users:(OI)(CI)(IO)(GR,GE)"
    - "CREATOR OWNER:(OI)(CI)(IO)(F)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:(RX)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:(RX)"
    - "APPLICATION PACKAGE AUTHORITY\\ALL RESTRICTED APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)"

company_title: 'MindPoint Group - A Quantum Sky Company'

file_managed_by_ansible: |-
  # File managed by ansible as part of {{ benchmark }} benchmark
  # As part of Ansible-lockdown
  # Provided by {{ company_title }}

# Both are raised in prelim.yml and both guard a control that would sever the run. Seeded here
# so neither control's `when` is ever evaluated against an undefined name.
#
# prelim_control_account_is_local - ansible_user carries no domain separator, so the run is
# connected as a local account whatever the transport. WN19-MS-000080 removes the network logon right
# from every local account, which severs BOTH WinRM and SSH, because Windows OpenSSH password
# authentication uses the same logon path. The console is the only way back in.
prelim_control_account_is_local: false

# prelim_local_account_network_logon - the above, and the transport is a network logon one.
# WN19-MS-000020 filters the privileged token of local accounts on network logon only, so SSH
# survives that control and is a genuine fallback for it.
prelim_local_account_network_logon: false

# Seeded false so a standalone host still applies the [System Access] controls;
# prelim raises it from the gathered windows_domain facts when the host is joined.
discovered_domain_joined: false
# On a domain joined host the Default Domain Policy owns [System Access], so the 13
# secedit backed controls cannot hold there. Seeded false; prelim sets it true when joined.
discovered_account_policy_is_domain_scoped: false
